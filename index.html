<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Auto 92 - Votre partenaire automobile à Nanterre</title>
    <meta name="description" content="Espace Auto 92 - Spécialistes en pièces auto, carte grise, réparation et entretien à Nanterre. Service professionnel et conseils experts." />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <link rel="preload" href="/vid2.mp4" as="video" type="video/mp4" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Libre+Franklin:wght@300;400;500;600;700;800;900&family=League+Spartan:wght@300;400;500;600;700;800;900&display=swap" as="style" />
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//cdn.chaty.app" />
  
  </head>
  <body>
    <div id="root"></div>
    <!-- Prevent Tawk.to widget from loading (removed in favor of WhatsApp) -->
    <script>
      (function() {
        function removeTawk() {
          document.querySelectorAll('script[src*="tawk"], script[src*="Tawk"], iframe[id*="tawk"], iframe[src*="tawk"], [class*="tawk"], [id*="tawk"]').forEach(function(el) { el.remove(); });
          if (window.Tawk_API) delete window.Tawk_API;
          if (window.Tawk_LoadStart) delete window.Tawk_LoadStart;
        }
        removeTawk();
        if (document.body) {
          var obs = new MutationObserver(removeTawk);
          obs.observe(document.body, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', removeTawk);
        window.addEventListener('load', removeTawk);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Chaty chat widget -->
    <script id="pixel-chaty" async="true" src="https://cdn.chaty.app/pixel.js?id=ha2CS6P6"></script>
  </body>
</html>
